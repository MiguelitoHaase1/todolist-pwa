<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tasks — The Clearing</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#FAF9F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF9F6;
      --bg-secondary: #F0EFEB;
      --surface: #FFFFFF;
      --border: #E5E4E0;
      --border-medium: #D1D0CC;
      --text: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-muted: #9B9B9B;
      --coral: #D97757;
      --coral-light: rgba(217, 119, 87, 0.1);
      --coral-hover: #C4654A;
      --sage: #B8C4B8;
      --success: #5A9E6F;
      --danger: #C75450;
      --p0: #C75450;
      --p1: #D97757;
      --p2: #C9A84C;
      --p3: #9B9B9B;
      --p4: #C5C1D6;
      --col-width: min(300px, 85vw);
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .refresh-fixed {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 200;
    }

    .header-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .header-btn:hover { color: var(--text); border-color: var(--border-medium); }
    .header-btn.primary {
      background: var(--coral);
      color: white;
      border-color: var(--coral);
    }
    .header-btn.primary:hover { background: var(--coral-hover); border-color: var(--coral-hover); }

    #board {
      display: flex;
      gap: 16px;
      padding: 20px;
      min-height: calc(100dvh - 57px);
      align-items: flex-start;
    }

    .column {
      flex: 0 0 var(--col-width);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .undated-indicator {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      writing-mode: vertical-lr;
      text-orientation: mixed;
      white-space: nowrap;
    }
    .undated-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--border);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .col-header {
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .col-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .col-date {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .col-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
    }

    .col-tasks {
      padding: 8px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
    }

    .col-tasks.drag-over {
      background: var(--coral-light);
      border-radius: var(--radius-sm);
    }

    .column.past-col {
      border-color: rgba(199, 84, 80, 0.25);
      background: rgba(199, 84, 80, 0.04);
    }
    .column.past-col .col-title { color: var(--danger); }
    .column.past-col .col-date { color: var(--danger); opacity: 0.7; }

    /* ── Task Cards ──────────────────────────── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: grab;
      position: relative;
      user-select: none;
      transition: transform 0.1s, opacity 0.1s, border-color 0.15s, box-shadow 0.15s;
    }

    .task-card:active { cursor: grabbing; }
    .task-card.dragging { opacity: 0.4; transform: scale(0.97); }
    .task-card:hover {
      border-color: var(--border-medium);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .task-title {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .desc-indicator {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .priority-pill {
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid;
    }

    .pill-p0 { color: var(--p0); border-color: var(--p0); background: rgba(199, 84, 80, 0.08); }
    .pill-p1 { color: var(--p1); border-color: var(--p1); background: var(--coral-light); }
    .pill-p2 { color: var(--p2); border-color: var(--p2); background: rgba(201, 168, 76, 0.08); }
    .pill-p3 { color: var(--p3); border-color: var(--border); background: var(--bg); }
    .pill-p4 { color: var(--p4); border-color: var(--p4); background: rgba(197, 193, 214, 0.1); }

    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
      flex-shrink: 0;
    }
    .action-btn:hover { color: var(--text); }

    .done-btn {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border-medium);
      border-radius: 8px;
      color: var(--border-medium);
      font-size: 18px;
      background: var(--bg);
    }
    .done-btn:hover { border-color: var(--success); color: var(--success); background: rgba(90, 158, 111, 0.06); }

    .move-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }
    .move-wrap .move-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .move-wrap:hover .move-icon { color: var(--coral); }
    .move-wrap input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      -webkit-appearance: none;
      border: none;
      padding: 0;
    }

    .drop-x {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      font-size: 13px;
      color: var(--border-medium);
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .task-card:hover .drop-x { opacity: 1; }
    .drop-x:hover { color: var(--danger); }

    /* Snooze (☾) greys a card in place until 05:00; next (★) marks the one card to do now. */
    .snooze-btn, .next-btn { width: 26px; height: 26px; font-size: 15px; }
    .snooze-btn[aria-pressed="true"], .next-btn[aria-pressed="true"] { color: var(--coral); }
    .task-card.is-snoozed { opacity: 0.45; }
    .task-card.is-next {
      border: 2px solid var(--coral);
      box-shadow: 0 0 0 3px var(--coral-light);
    }
    .task-card.is-next .task-title::before {
      content: "Next · ";
      color: var(--coral);
      font-weight: 600;
    }

    .task-card { cursor: pointer; }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Toast ──────────────────────────────── */
    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      max-width: 380px;
      text-align: center;
      line-height: 1.4;
      box-shadow: var(--shadow);
      z-index: 200;
    }
    #status.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #status .toast-action { font-weight: 600; }
    #status .toast-task { color: var(--text-secondary); }
    #status .toast-undo {
      display: inline-block;
      margin-left: 12px;
      color: var(--coral);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      padding: 2px 0;
    }
    #status .toast-undo:hover { text-decoration: underline; }

    /* ── Edit Modal ────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.4);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 560px;
      padding: 28px 24px 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
    }

    .modal h2 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--coral); }

    .field textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.5;
    }

    /* Fullscreen description editor (1c375566 + mobile exit 86f46774 / cc087344) */
    .desc-fullscreen-modal {
      max-width: none; width: 100vw; height: 100vh; max-height: 100vh;
      padding: 0; border-radius: 0; display: flex; flex-direction: column;
    }
    .desc-fullscreen-modal .ds-header {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 20px 12px;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .desc-fullscreen-modal .ds-header h2 { margin: 0; font-size: 18px; }
    .desc-fullscreen-modal .ds-close-x {
      background: none; border: none; color: var(--text-muted);
      font-size: 28px; line-height: 1; cursor: pointer; padding: 4px 8px;
      min-width: 44px; min-height: 44px;
    }
    .desc-fullscreen-modal .ds-close-x:hover { color: var(--coral); }
    .desc-fullscreen-modal .ds-body { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 16px 20px; }
    .desc-fullscreen-modal textarea {
      flex: 1; min-height: 0; width: 100%; padding: 14px; font-size: 16px;
      font-family: inherit; line-height: 1.6; border: 1px solid var(--border);
      border-radius: 8px; resize: none; outline: none;
    }
    .desc-fullscreen-modal textarea:focus { border-color: var(--coral); }
    .desc-fullscreen-modal .ds-preview {
      flex: 1; overflow-y: auto; padding: 14px; border: 1px solid var(--border);
      border-radius: 8px; font-family: 'Source Serif 4', serif; line-height: 1.6; display: none;
    }
    .desc-fullscreen-modal.preview-mode textarea { display: none; }
    .desc-fullscreen-modal.preview-mode .ds-preview { display: block; }
    .btn-expand {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 6px;
    }
    .btn-expand:hover { border-color: var(--coral); color: var(--coral); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-cancel:hover { border-color: var(--border-medium); color: var(--text); }

    .btn-save {
      background: var(--coral);
      border: 1px solid var(--coral);
      color: white;
    }
    .btn-save:hover { background: var(--coral-hover); }

    /* ── Add Task Form ─────────────────────── */
    .add-task-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      margin: 4px 10px 12px;
      border: 1px dashed var(--border-medium);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      width: calc(100% - 20px);
    }
    .add-task-trigger:hover {
      border-color: var(--coral);
      color: var(--coral);
      background: var(--coral-light);
    }

    .add-task-form {
      display: none;
      padding: 4px 10px 12px;
    }
    .add-task-form.open { display: block; }

    .add-task-form .add-card {
      background: var(--surface);
      border: 1px solid var(--coral);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .add-task-form .add-title {
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      margin-bottom: 10px;
      resize: none;
      line-height: 1.4;
    }
    .add-task-form .add-title::placeholder { color: var(--text-muted); }

    .add-task-form .add-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-task-form .add-priority {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      cursor: pointer;
    }

    .add-task-form .add-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .add-task-form .add-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .add-btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .add-btn-cancel:hover { border-color: var(--border-medium); }

    .add-btn-save {
      background: var(--coral);
      border: 1px solid var(--coral);
      color: white;
    }
    .add-btn-save:hover { background: var(--coral-hover); }

    /* ── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

    /* ── Mobile touch ───────────────────────── */
    @media (hover: none) {
      .task-card:hover { transform: none; box-shadow: none; }
      .drop-x { opacity: 0.6; }
    }

    .btn-drop {
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .btn-drop:hover { background: rgba(199, 84, 80, 0.08); }
    /* Description preview modal (c4dd86d6 — long markdown descriptions) */
    .desc-view-modal { max-width: 720px; max-height: 80vh; overflow-y: auto; padding: 28px; font-family: 'Source Serif 4', serif; color: var(--text); line-height: 1.6; }
    .desc-view-modal h1, .desc-view-modal h2, .desc-view-modal h3 { margin-top: 16px; margin-bottom: 8px; }
    .desc-view-modal p { margin: 0 0 12px; }
    .desc-view-modal code { background: var(--border); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.9em; }
    .desc-view-modal pre { background: var(--border); padding: 12px; border-radius: 6px; overflow-x: auto; }
    .desc-view-modal a { color: var(--accent); word-break: break-all; }
    .desc-view-modal ul, .desc-view-modal ol { padding-left: 24px; margin: 0 0 12px; }
    .btn-preview {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }
    .btn-preview:hover { background: rgba(217, 119, 87, 0.08); color: var(--accent); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>

<header>
  <h1>Tasks</h1>
</header>
<button class="header-btn refresh-fixed" id="refresh-btn" title="Refresh">↻</button>

<div id="board"></div>

<div id="status"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Task</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="edit-title" />
    </div>
    <div class="field">
      <label>Description <button type="button" class="btn-preview" id="edit-description-preview" title="Preview as markdown">Preview</button><button type="button" class="btn-expand" id="edit-description-expand" title="Open fullscreen editor">&#9974; Expand</button></label>
      <textarea id="edit-description" data-autogrow placeholder="Add notes or details..."></textarea>
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="edit-priority">
        <option value="0">P0 — Critical</option>
        <option value="1">P1 — High</option>
        <option value="2">P2 — Medium</option>
        <option value="3">P3 — Normal</option>
        <option value="4">P4 — Backlog</option>
      </select>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input type="date" id="edit-date" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="edit-cancel">Cancel</button>
      <button class="btn-save" id="edit-save">Save</button>
    </div>
    <button class="btn-drop" id="edit-drop">Drop this task</button>
  </div>
</div>

<!-- Description preview modal (c4dd86d6 — sanitized markdown) -->
<div class="modal-overlay" id="desc-view-modal" data-testid="description-modal">
  <div class="modal desc-view-modal" role="dialog" aria-modal="true" aria-label="Description preview">
    <div id="desc-view-body"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="desc-view-close">Close</button>
    </div>
  </div>
</div>

<!-- Fullscreen description editor (1c375566 + mobile exit 86f46774 / cc087344) -->
<div class="modal-overlay" id="desc-fullscreen-modal">
  <div class="modal desc-fullscreen-modal" role="dialog" aria-modal="true" aria-label="Fullscreen description editor">
    <div class="ds-header">
      <h2>Description</h2>
      <button class="ds-close-x" id="desc-fullscreen-close-x" type="button" aria-label="Close fullscreen editor">&times;</button>
    </div>
    <div class="ds-body">
      <textarea id="desc-fullscreen-textarea" placeholder="Write notes, paste markdown, think out loud..."></textarea>
      <div class="ds-preview" id="desc-fullscreen-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-preview" id="desc-fullscreen-toggle" type="button">Preview</button>
      <button class="btn-cancel" id="desc-fullscreen-close" type="button">Done</button>
    </div>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const SB_URL = 'https://xwxsrsybllifbivhgojl.supabase.co';
  const SB_KEY = 'sb_publishable_fcZRHJWzxFYrwfQVmTy0GQ_6DVu0Byk';

  const PRIORITY_LABELS = ['P0', 'P1', 'P2', 'P3', 'P4'];

  // ── Dates ───────────────────────────────────────────────────────────────
  function localDateStr(offset = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  }

  function colLabel(offset) {
    return ['Today', 'Tomorrow', '+2 days', '+3 days'][offset] || `+${offset}`;
  }

  function formatDate(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function formatDateStr(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  /** Build MECE column definitions: Past (overdue), Today, T+1…T+5, Next 7 (T+6–T+12), Later (T+13+) */
  function buildColumnDefs() {
    const cols = [];
    const today = localDateStr(0);

    // "Past" — overdue tasks (due_date < today)
    cols.push({
      id: 'past',
      label: 'Past',
      sublabel: 'Overdue',
      match: (d) => d < today,
      addDate: today, // new tasks from past column get today's date
      isPast: true,
    });

    const labels = ['Today', 'Tomorrow', '+2 days', '+3 days', '+4 days', '+5 days'];

    // Individual day columns: T+0 through T+5
    for (let i = 0; i < 6; i++) {
      const dateStr = localDateStr(i);
      cols.push({
        id: `day-${i}`,
        label: labels[i],
        sublabel: formatDate(i),
        match: (d) => d === dateStr,
        addDate: dateStr,
      });
    }

    // "Next 7 days" — T+6 through T+12
    const t6 = localDateStr(6);
    const t12 = localDateStr(12);
    cols.push({
      id: 'next-7',
      label: 'Next 7 days',
      sublabel: `${formatDateStr(t6)} – ${formatDateStr(t12)}`,
      match: (d) => d >= t6 && d <= t12,
      addDate: t6,
    });

    // "Later" — T+13 onward
    const t13 = localDateStr(13);
    cols.push({
      id: 'later',
      label: 'Later',
      sublabel: `After ${formatDateStr(t12)}`,
      match: (d) => d > t12,
      addDate: t13,
    });

    return cols;
  }

  // ── Supabase ────────────────────────────────────────────────────────────
  function sbHeaders() {
    return {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
    };
  }

  let undatedCount = 0;

  async function fetchTasks() {
    if (!SB_URL || !SB_KEY) return DEMO_TASKS;
    const from = localDateStr(0);
    // Fetch dated tasks (today onward)
    const futureRes = fetch(
      `${SB_URL}/rest/v1/tasks?select=*&status=eq.open&due_date=gte.${from}&order=priority.asc,created_at.asc`,
      { headers: sbHeaders() }
    );
    // Fetch overdue tasks (before today)
    const pastRes = fetch(
      `${SB_URL}/rest/v1/tasks?select=*&status=eq.open&due_date=lt.${from}&order=priority.asc,created_at.asc`,
      { headers: sbHeaders() }
    );
    // Count undated tasks separately
    const countRes = fetch(
      `${SB_URL}/rest/v1/tasks?select=id&status=eq.open&due_date=is.null`,
      { headers: sbHeaders() }
    );

    const [future, past, undated] = await Promise.all([futureRes, pastRes, countRes]);
    if (!future.ok) throw new Error(`Fetch failed: ${future.status}`);

    const futureTasks = await future.json();
    const pastTasks = past.ok ? await past.json() : [];
    if (undated.ok) {
      const u = await undated.json();
      undatedCount = u.length;
    }

    return [...pastTasks, ...futureTasks];
  }

  async function patchTask(taskId, updates) {
    if (!SB_URL || !SB_KEY) return;
    const res = await fetch(`${SB_URL}/rest/v1/tasks?id=eq.${taskId}`, {
      method: 'PATCH',
      headers: sbHeaders(),
      body: JSON.stringify({ ...updates, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error(`Update failed: ${res.status}`);
  }

  // One call moves the mark: the RPC clears the old next card and sets this
  // one in a single transaction. null just clears it.
  async function setNextTask(taskId) {
    if (!SB_URL || !SB_KEY) return;
    const res = await fetch(`${SB_URL}/rest/v1/rpc/set_next_task`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ p_id: taskId }),
    });
    if (!res.ok) throw new Error(`Next failed: ${res.status}`);
  }

  async function createTask({ title, priority = 3, due_date, description = null }) {
    if (!SB_URL || !SB_KEY) return null;
    const res = await fetch(`${SB_URL}/rest/v1/tasks`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ title, priority, due_date, description, status: 'open' }),
    });
    if (!res.ok) throw new Error(`Create failed: ${res.status}`);
    const [created] = await res.json();
    emitEvent(created.id, 'created', null, `P${priority}`);
    return created;
  }

  async function emitEvent(taskId, eventType, prev, next) {
    if (!SB_URL || !SB_KEY) return;
    fetch(`${SB_URL}/rest/v1/task_events`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({
        task_id: taskId,
        event_type: eventType,
        previous_value: prev,
        new_value: next,
        source: 'pwa',
      }),
    }).catch(() => {});
  }

  // ── Demo data ───────────────────────────────────────────────────────────
  const DEMO_TASKS = [
    { id: 'demo-0', title: 'Follow up with design review', priority: 1, due_date: localDateStr(-2), status: 'open' },
    { id: 'demo-00', title: 'Submit expense report', priority: 2, due_date: localDateStr(-1), status: 'open' },
    { id: 'demo-1', title: 'Review Q2 roadmap', priority: 0, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-2', title: 'Write experiment log', priority: 1, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-3', title: 'Ship kanban PWA', priority: 1, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-4', title: 'Update strategies doc', priority: 2, due_date: localDateStr(1), status: 'open' },
    { id: 'demo-5', title: 'Call with advisor', priority: 0, due_date: localDateStr(1), status: 'open' },
    { id: 'demo-6', title: 'Draft investor update', priority: 2, due_date: localDateStr(2), status: 'open' },
    { id: 'demo-7', title: 'Review product metrics', priority: 3, due_date: localDateStr(3), status: 'open' },
  ];

  // ── State ───────────────────────────────────────────────────────────────
  let tasks = [];
  let draggedId = null;
  let editingId = null;

  // ── Toast with undo ─────────────────────────────────────────────────────
  let toastTimer;
  let pendingUndo = null;

  function toast(html, undoFn) {
    const el = document.getElementById('status');
    pendingUndo = null;
    const undoLink = undoFn ? '<a class="toast-undo" id="toast-undo">Undo</a>' : '';
    el.innerHTML = html + undoLink;
    el.classList.add('visible');
    clearTimeout(toastTimer);

    if (undoFn) {
      pendingUndo = undoFn;
      const undoBtn = document.getElementById('toast-undo');
      if (undoBtn) {
        undoBtn.addEventListener('click', e => {
          e.stopPropagation();
          if (pendingUndo) { pendingUndo(); pendingUndo = null; }
          el.classList.remove('visible');
          clearTimeout(toastTimer);
        });
      }
    }

    toastTimer = setTimeout(() => {
      el.classList.remove('visible');
      pendingUndo = null;
    }, 4000);
  }

  function friendlyDate(dateStr) {
    if (!dateStr) return '';
    const today = localDateStr(0);
    const tomorrow = localDateStr(1);
    if (dateStr === today) return 'today';
    if (dateStr === tomorrow) return 'tomorrow';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function truncate(str, n = 28) {
    return str.length > n ? str.slice(0, n) + '...' : str;
  }

  // --- card state ---
  /** The next 05:00 in Copenhagen strictly after `now`, as an ISO string. */
  function snoozeUntil(now) {
    const fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Copenhagen', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23',
    });
    const part = (d, type) => Number(fmt.formatToParts(d).find(p => p.type === type).value);
    let day = Date.UTC(part(now, 'year'), part(now, 'month') - 1, part(now, 'day'));
    if (part(now, 'hour') >= 5) day += 86400000;
    // UTC+1 in winter, UTC+2 in summer; the clocks change before 05:00.
    for (const offset of [1, 2]) {
      const candidate = new Date(day + 5 * 3600000 - offset * 3600000);
      if (part(candidate, 'hour') === 5) return candidate.toISOString();
    }
    return new Date(day + 4 * 3600000).toISOString();
  }

  function isSnoozed(snoozedUntil, now) {
    if (!snoozedUntil) return false;
    const until = new Date(snoozedUntil).getTime();
    return Number.isFinite(until) && until > now.getTime();
  }

  /** Next wins over snooze: "do this now" can't also be "pay less attention". */
  function cardStateClass(task, now) {
    if (task.is_next === true) return ' is-next';
    return isSnoozed(task.snoozed_until, now) ? ' is-snoozed' : '';
  }
  // --- end card state ---

  // ── Board ───────────────────────────────────────────────────────────────
  function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';

    const colDefs = buildColumnDefs();

    for (const def of colDefs) {
      const colTasks = tasks.filter(t => t.due_date && def.match(t.due_date));
      // The next card leads its column; sort is stable, so the rest keep fetch order.
      colTasks.sort((a, b) => (b.is_next === true) - (a.is_next === true));

      // Hide past column when empty — no need for an empty overdue lane
      if (def.isPast && colTasks.length === 0) continue;

      const col = document.createElement('div');
      col.className = 'column' + (def.isPast ? ' past-col' : '');
      col.innerHTML = `
        <div class="col-header">
          <div>
            <div class="col-title">${def.label}</div>
            <div class="col-date">${def.sublabel}</div>
          </div>
          <span class="col-count">${colTasks.length}</span>
        </div>
        <div class="col-tasks" data-date="${def.addDate}">
          ${colTasks.length === 0
            ? '<div class="empty-state">No tasks</div>'
            : colTasks.map(taskCard).join('')}
        </div>
        ${def.isPast ? '' : `
        <button class="add-task-trigger" data-date="${def.addDate}">+ Add task</button>
        <div class="add-task-form" data-date="${def.addDate}">
          <div class="add-card">
            <input type="text" class="add-title" data-date="${def.addDate}" placeholder="Task title..." />
            <div class="add-row">
              <select class="add-priority" data-date="${def.addDate}">
                <option value="0">P0</option>
                <option value="1">P1</option>
                <option value="2">P2</option>
                <option value="3" selected>P3</option>
                <option value="4">P4</option>
              </select>
              <div class="add-actions">
                <button class="add-btn add-btn-cancel" data-date="${def.addDate}">Cancel</button>
                <button class="add-btn add-btn-save" data-date="${def.addDate}">Add</button>
              </div>
            </div>
          </div>
        </div>`}
      `;
      board.appendChild(col);
    }

    // Undated tasks indicator after the last column
    if (undatedCount > 0) {
      const indicator = document.createElement('div');
      indicator.className = 'undated-indicator';
      indicator.innerHTML = `<span class="undated-count">${undatedCount}</span> undated task${undatedCount !== 1 ? 's' : ''}`;
      board.appendChild(indicator);
    }

    attachListeners();
  }

  function taskCard(task) {
    const p = task.priority ?? 3;
    const hasDesc = task.description ? '<span class="desc-indicator" title="Has description">✎</span>' : '';
    return `
      <div class="task-card${cardStateClass(task, new Date())}" draggable="true" data-id="${task.id}">
        <button class="action-btn drop-x" title="Drop" data-id="${task.id}">✕</button>
        <div class="task-title">${escHtml(task.title)} ${hasDesc}</div>
        <div class="task-footer">
          <div class="footer-left">
            <div class="move-wrap">
              <div class="move-icon">→</div>
              <input type="date" class="move-date" data-id="${task.id}" value="${task.due_date || ''}" title="Move date" />
            </div>
            <span class="priority-pill pill-p${p}">${PRIORITY_LABELS[p]}</span>
            <button class="action-btn snooze-btn" title="Snooze until tomorrow morning" aria-pressed="${isSnoozed(task.snoozed_until, new Date())}" data-id="${task.id}">☾</button>
            <button class="action-btn next-btn" title="Do this next" aria-pressed="${task.is_next === true}" data-id="${task.id}">★</button>
          </div>
          <button class="action-btn done-btn" title="Done" data-id="${task.id}">✓</button>
        </div>
      </div>
    `;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Listeners ───────────────────────────────────────────────────────────
  function attachListeners() {
    // Drag
    document.querySelectorAll('.task-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', e => {
        draggedId = card.dataset.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedId = null;
      });
    });

    document.querySelectorAll('.col-tasks').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', async e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (!draggedId) return;
        const newDate = zone.dataset.date;
        const task = tasks.find(t => t.id === draggedId);
        if (!task || task.due_date === newDate) return;
        const oldDate = task.due_date;
        const tid = task.id;
        task.due_date = newDate;
        buildBoard();
        toast(
          `<span class="toast-action">Moved to ${friendlyDate(newDate)}</span><br><span class="toast-task">${truncate(task.title)}</span>`,
          () => { const t = tasks.find(x => x.id === tid); if (t) { t.due_date = oldDate; buildBoard(); patchTask(tid, { due_date: oldDate }); } }
        );
        try {
          await patchTask(tid, { due_date: newDate });
          emitEvent(tid, 'deferred', oldDate, newDate);
        } catch {
          toast('Failed — reverting');
          task.due_date = oldDate;
          buildBoard();
        }
      });
    });

    // Done
    document.querySelectorAll('.done-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        const snapshot = { ...task };
        tasks = tasks.filter(t => t.id !== id);
        buildBoard();
        toast(
          `<span class="toast-action">✓ Done</span><br><span class="toast-task">${truncate(snapshot.title)}</span>`,
          () => { tasks.push(snapshot); buildBoard(); patchTask(id, { status: 'open' }); }
        );
        try {
          await patchTask(id, { status: 'done' });
          emitEvent(id, 'status_changed', 'open', 'done');
        } catch { /* best effort */ }
      });
    });

    // Drop (✕ top right)
    document.querySelectorAll('.drop-x').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        const snapshot = { ...task };
        tasks = tasks.filter(t => t.id !== id);
        buildBoard();
        toast(
          `<span class="toast-action">Dropped</span><br><span class="toast-task">${truncate(snapshot.title)}</span>`,
          () => { tasks.push(snapshot); buildBoard(); patchTask(id, { status: 'open' }); }
        );
        try {
          await patchTask(id, { status: 'dropped' });
          emitEvent(id, 'status_changed', 'open', 'dropped');
        } catch { /* best effort */ }
      });
    });

    // Snooze (☾) — tap to grey until 05:00, tap again to lift
    document.querySelectorAll('.snooze-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const task = tasks.find(t => t.id === btn.dataset.id);
        if (!task) return;
        const old = task.snoozed_until ?? null;
        const next = isSnoozed(old, new Date()) ? null : snoozeUntil(new Date());
        task.snoozed_until = next;
        buildBoard();
        toast(`<span class="toast-action">${next ? 'Snoozed till morning' : 'Unsnoozed'}</span><br><span class="toast-task">${truncate(task.title)}</span>`);
        try {
          await patchTask(task.id, { snoozed_until: next });
        } catch {
          toast('Failed — try again');
          task.snoozed_until = old;
          buildBoard();
        }
      });
    });

    // Next (★) — one card at a time; tap the next card again to clear it
    document.querySelectorAll('.next-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const task = tasks.find(t => t.id === btn.dataset.id);
        if (!task) return;
        const before = tasks.map(t => [t, t.is_next, t.snoozed_until]);
        const target = task.is_next === true ? null : task.id;
        for (const t of tasks) t.is_next = t.id === target;
        if (target) task.snoozed_until = null; // the RPC lifts the snooze too
        buildBoard();
        toast(`<span class="toast-action">${target ? '★ Next' : 'Next cleared'}</span><br><span class="toast-task">${truncate(task.title)}</span>`);
        try {
          await setNextTask(target);
        } catch {
          toast('Failed — try again');
          for (const [t, n, s] of before) { t.is_next = n; t.snoozed_until = s; }
          buildBoard();
        }
      });
    });

    // Move date (inline date input on → arrow)
    document.querySelectorAll('.move-date').forEach(input => {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('change', async e => {
        e.stopPropagation();
        const id = input.dataset.id;
        const newDate = input.value;
        if (!id || !newDate) return;
        const task = tasks.find(t => t.id === id);
        if (!task || task.due_date === newDate) return;
        const oldDate = task.due_date;
        const name = truncate(task.title);
        task.due_date = newDate;
        buildBoard();
        toast(
          `<span class="toast-action">Moved to ${friendlyDate(newDate)}</span><br><span class="toast-task">${name}</span>`,
          () => { const t = tasks.find(x => x.id === id); if (t) { t.due_date = oldDate; buildBoard(); patchTask(id, { due_date: oldDate }); } }
        );
        try {
          await patchTask(id, { due_date: newDate });
          emitEvent(id, 'deferred', oldDate, newDate);
        } catch {
          toast('Failed — reverting');
          task.due_date = oldDate;
          buildBoard();
        }
      });
    });

    // Card body click → edit modal (skip if clicking a button or the date input)
    document.querySelectorAll('.task-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('.action-btn') || e.target.closest('.move-wrap')) return;
        openEditModal(card.dataset.id);
      });
    });

    // Add task — trigger button
    document.querySelectorAll('.add-task-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        const date = btn.dataset.date;
        btn.style.display = 'none';
        const form = document.querySelector(`.add-task-form[data-date="${date}"]`);
        form.classList.add('open');
        form.querySelector('.add-title').focus();
      });
    });

    // Add task — cancel
    document.querySelectorAll('.add-btn-cancel').forEach(btn => {
      btn.addEventListener('click', () => {
        const date = btn.dataset.date;
        const form = document.querySelector(`.add-task-form[data-date="${date}"]`);
        form.classList.remove('open');
        form.querySelector('.add-title').value = '';
        form.querySelector('.add-priority').value = '3';
        document.querySelector(`.add-task-trigger[data-date="${date}"]`).style.display = '';
      });
    });

    // Add task — save
    document.querySelectorAll('.add-btn-save').forEach(btn => {
      btn.addEventListener('click', () => submitAddTask(btn.dataset.date));
    });

    // Add task — Enter key
    document.querySelectorAll('.add-title').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submitAddTask(input.dataset.date); }
        if (e.key === 'Escape') {
          const date = input.dataset.date;
          const form = document.querySelector(`.add-task-form[data-date="${date}"]`);
          form.classList.remove('open');
          input.value = '';
          document.querySelector(`.add-task-trigger[data-date="${date}"]`).style.display = '';
        }
      });
    });
  }

  // ── Add Task Submit ─────────────────────────────────────────────────────
  async function submitAddTask(date) {
    const form = document.querySelector(`.add-task-form[data-date="${date}"]`);
    const titleInput = form.querySelector('.add-title');
    const prioritySelect = form.querySelector('.add-priority');
    const title = titleInput.value.trim();
    if (!title) { titleInput.focus(); return; }

    const priority = parseInt(prioritySelect.value);
    const saveBtn = form.querySelector('.add-btn-save');
    saveBtn.textContent = '...';
    saveBtn.disabled = true;

    try {
      const created = await createTask({ title, priority, due_date: date });
      if (created) {
        tasks.push(created);
      } else {
        tasks.push({ id: 'local-' + Date.now(), title, priority, due_date: date, status: 'open' });
      }
      buildBoard();
      toast(`<span class="toast-action">+ Added</span><br><span class="toast-task">${truncate(title)}</span>`);
    } catch (err) {
      console.error(err);
      toast('Failed to add task');
      saveBtn.textContent = 'Add';
      saveBtn.disabled = false;
    }
  }

  // ── Edit Modal ──────────────────────────────────────────────────────────
  function openEditModal(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    editingId = taskId;
    document.getElementById('edit-title').value = task.title;
    document.getElementById('edit-description').value = task.description || '';
    document.getElementById('edit-priority').value = task.priority ?? 3;
    document.getElementById('edit-date').value = task.due_date || '';
    document.getElementById('edit-modal').classList.add('open');
  }

  document.getElementById('edit-cancel').addEventListener('click', () => {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  });

  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      e.currentTarget.classList.remove('open');
      editingId = null;
    }
  });

  // Description preview modal — renders the textarea's markdown via marked + DOMPurify.
  (function setupDescriptionPreview(){
    const previewBtn = document.getElementById('edit-description-preview');
    const viewModal = document.getElementById('desc-view-modal');
    const viewBody = document.getElementById('desc-view-body');
    const closeBtn = document.getElementById('desc-view-close');
    if (!previewBtn || !viewModal || !viewBody || !closeBtn) return;

    function renderMarkdown(source) {
      // Defensive fallback if CDN scripts didn't load.
      if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
        const pre = document.createElement('pre');
        pre.textContent = source;
        viewBody.innerHTML = '';
        viewBody.appendChild(pre);
        return;
      }
      viewBody.innerHTML = DOMPurify.sanitize(marked.parse(source));
    }

    previewBtn.addEventListener('click', () => {
      const source = document.getElementById('edit-description').value || '';
      if (!source.trim()) return; // nothing to preview
      renderMarkdown(source);
      viewModal.classList.add('open');
    });

    closeBtn.addEventListener('click', () => viewModal.classList.remove('open'));
    viewModal.addEventListener('click', e => {
      if (e.target === viewModal) viewModal.classList.remove('open');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && viewModal.classList.contains('open')) {
        viewModal.classList.remove('open');
      }
    });
  })();

  // Fullscreen description editor (hypothesis 1c375566) — modal-in-modal
  // above the edit modal. Expand opens it, the textarea stays in sync with
  // the edit-modal textarea, Preview toggles between edit and rendered view.
  (function setupDescriptionFullscreen(){
    const expandBtn = document.getElementById('edit-description-expand');
    const fsModal = document.getElementById('desc-fullscreen-modal');
    const fsTextarea = document.getElementById('desc-fullscreen-textarea');
    const fsPreview = document.getElementById('desc-fullscreen-preview');
    const toggleBtn = document.getElementById('desc-fullscreen-toggle');
    const closeBtn = document.getElementById('desc-fullscreen-close');
    const editTextarea = document.getElementById('edit-description');
    if (!expandBtn || !fsModal || !fsTextarea || !fsPreview || !toggleBtn || !closeBtn || !editTextarea) return;

    const fsInner = fsModal.querySelector('.modal');

    function renderFsPreview(source) {
      if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
        const pre = document.createElement('pre');
        pre.textContent = source;
        fsPreview.innerHTML = '';
        fsPreview.appendChild(pre);
        return;
      }
      fsPreview.innerHTML = DOMPurify.sanitize(marked.parse(source || ''));
    }

    function openFs() {
      fsTextarea.value = editTextarea.value || '';
      if (fsInner) fsInner.classList.remove('preview-mode');
      toggleBtn.textContent = 'Preview';
      fsModal.classList.add('open');
      // Defer focus so iOS opens the keyboard predictably.
      setTimeout(() => fsTextarea.focus(), 50);
    }
    function closeFs() {
      // Sync back to the edit-modal textarea so Save picks up the changes.
      editTextarea.value = fsTextarea.value;
      // Also kick autogrow if it's wired on the underlying textarea.
      editTextarea.dispatchEvent(new Event('input', { bubbles: true }));
      fsModal.classList.remove('open');
      if (fsInner) fsInner.classList.remove('preview-mode');
    }

    const closeXBtn = document.getElementById('desc-fullscreen-close-x');
    expandBtn.addEventListener('click', openFs);
    closeBtn.addEventListener('click', closeFs);
    if (closeXBtn) closeXBtn.addEventListener('click', closeFs);
    fsModal.addEventListener('click', e => {
      if (e.target === fsModal) closeFs();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && fsModal.classList.contains('open')) closeFs();
    });

    toggleBtn.addEventListener('click', () => {
      if (!fsInner) return;
      const intoPreview = !fsInner.classList.contains('preview-mode');
      if (intoPreview) {
        renderFsPreview(fsTextarea.value);
        fsInner.classList.add('preview-mode');
        toggleBtn.textContent = 'Edit';
      } else {
        fsInner.classList.remove('preview-mode');
        toggleBtn.textContent = 'Preview';
        setTimeout(() => fsTextarea.focus(), 50);
      }
    });
  })();

  // Autogrow for the edit-modal description textarea (1c375566) — grows with
  // content up to the viewport; users who prefer a fixed size can resize via
  // the CSS `resize: vertical` handle.
  (function setupDescriptionAutogrow(){
    const el = document.getElementById('edit-description');
    if (!el || !el.hasAttribute('data-autogrow')) return;
    function grow() {
      el.style.height = 'auto';
      // 86f46774: cap at 35% of viewport so Save/Drop/Cancel stay reachable;
      // anything longer scrolls inside the textarea. Fullscreen editor is
      // the escape hatch for real long-form edits.
      const maxH = Math.floor(window.innerHeight * 0.35);
      const next = Math.min(el.scrollHeight + 2, maxH);
      el.style.height = next + 'px';
    }
    el.addEventListener('input', grow);
    // Run once after the edit modal opens (value is set then). A mutation
    // observer is overkill; poll the open class.
    const editModal = document.getElementById('edit-modal');
    if (editModal) {
      new MutationObserver(() => {
        if (editModal.classList.contains('open')) setTimeout(grow, 20);
      }).observe(editModal, { attributes: true, attributeFilter: ['class'] });
    }
  })();

  document.getElementById('edit-drop').addEventListener('click', async () => {
    if (!editingId) return;
    const id = editingId;
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const snapshot = { ...task };
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
    tasks = tasks.filter(t => t.id !== id);
    buildBoard();
    toast(
      `<span class="toast-action">Dropped</span><br><span class="toast-task">${truncate(snapshot.title)}</span>`,
      () => { tasks.push(snapshot); buildBoard(); patchTask(id, { status: 'open' }); }
    );
    try {
      await patchTask(id, { status: 'dropped' });
      emitEvent(id, 'status_changed', 'open', 'dropped');
    } catch { /* best effort */ }
  });

  document.getElementById('edit-save').addEventListener('click', async () => {
    if (!editingId) return;
    const task = tasks.find(t => t.id === editingId);
    if (!task) return;

    const newTitle = document.getElementById('edit-title').value.trim();
    const newDesc = document.getElementById('edit-description').value.trim() || null;
    const newPriority = parseInt(document.getElementById('edit-priority').value);
    const newDate = document.getElementById('edit-date').value;

    const updates = {};
    if (newTitle && newTitle !== task.title) {
      updates.title = newTitle;
      emitEvent(editingId, 'title_changed', task.title, newTitle);
      task.title = newTitle;
    }
    const oldDesc = task.description || null;
    if (newDesc !== oldDesc) {
      updates.description = newDesc;
      task.description = newDesc;
    }
    if (newPriority !== task.priority) {
      emitEvent(editingId, 'priority_changed', String(task.priority), String(newPriority));
      updates.priority = newPriority;
      task.priority = newPriority;
    }
    if (newDate && newDate !== task.due_date) {
      emitEvent(editingId, 'deferred', task.due_date, newDate);
      updates.due_date = newDate;
      task.due_date = newDate;
    }

    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
    buildBoard();

    if (Object.keys(updates).length > 0) {
      const changes = [];
      if (updates.title) changes.push('title');
      if ('description' in updates) changes.push('description');
      if ('priority' in updates) changes.push(`priority → P${updates.priority}`);
      if (updates.due_date) changes.push(`date → ${friendlyDate(updates.due_date)}`);
      toast(`<span class="toast-action">Saved</span> ${changes.join(', ')}<br><span class="toast-task">${truncate(task.title)}</span>`);
      try { await patchTask(task.id, updates); }
      catch { toast('Save failed'); }
    }
  });

  // ── Load ────────────────────────────────────────────────────────────────
  async function loadTasks() {
    try {
      tasks = await fetchTasks();
      buildBoard();
      if (!SB_URL) toast('Demo mode');
    } catch (err) {
      toast('Error loading tasks');
      console.error(err);
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadTasks);

  loadTasks();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
